name: peleia
description: PeleIA — Skincare com Inteligência Artificial para o mercado brasileiro
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # ── AI / Networking ──────────────────────────────
  http: ^1.2.1                      # Backend proxy (Cloudflare Worker) → Gemini

  # ── Auth ──────────────────────────────────────────
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0             # Login anônimo: identidade verificada no proxy

  # ── Camera / Image ────────────────────────────────
  camera: ^0.11.0                   # Câmera nativa Android/iOS
  image_picker: ^1.1.2              # Galeria ou câmera (fallback)
  image: ^4.1.7                     # Processamento de imagem (resize antes de enviar)

  # ── State Management ──────────────────────────────
  flutter_riverpod: ^2.5.1          # State management reativo
  riverpod_annotation: ^2.3.5

  # ── Storage & Persistence ────────────────────────
  shared_preferences: ^2.2.3        # Salvar histórico de análises
  path_provider: ^2.1.3

  # ── Monetização ───────────────────────────────────
  purchases_flutter: ^10.18.1        # RevenueCat (Google Play Billing)

  # ── UI / Animations ───────────────────────────────
  lottie: ^3.1.2                    # Animações (scan loading)
  flutter_animate: ^4.5.0           # Micro-animações
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0                   # Loading skeleton

  # ── Utils ─────────────────────────────────────────
  go_router: ^13.2.5                # Navegação declarativa
  intl: ^0.19.0                     # Formatação R$ (NumberFormat)
  permission_handler: ^11.3.1       # Permissão de câmera Android
  url_launcher: ^6.2.6              # Links afiliados (Shopee, Mercado Livre)
  envied: ^0.5.4                    # Gerenciamento seguro de chaves API
  flutter_dotenv: ^5.1.0
  package_info_plus: ^10.2.2        # Build do app (versão mínima exigida pela config)
  share_plus: ^13.3.1
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  envied_generator: ^0.5.4
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/config/
    - .env
