name = "peleia-gemini-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"
account_id = "ab48f7a2be15e4a97cc32e5d303f185a"

[vars]
ENVIRONMENT = "production"
# ID do projeto Firebase (o mesmo do google-services.json do app).
FIREBASE_PROJECT_ID = "peleia-e0b3a"
# Entitlement do RevenueCat que libera o Pro.
PREMIUM_ENTITLEMENT_ID = "premium"
# Origens web liberadas para POST (separadas por vírgula). O app Android não envia Origin.
ALLOWED_ORIGINS = ""

# Durable Object para controle atômico de cotas por usuário
[durable_objects]
bindings = [
  { name = "QUOTA_DO", class_name = "QuotaDurableObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaDurableObject"]

# Configuração remota (produtos, planos, cotas, textos, prompts).
# Crie com: npx wrangler kv namespace create CONFIG_KV  e cole o id abaixo.
# Publique com: python3 ../../scripts/publish_config.py
[[kv_namespaces]]
binding = "CONFIG_KV"
id = "c6c94e668f604e18adc74bbfb88b7413"

# Segredos (via CLI):
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put REVENUECAT_SECRET_KEY
