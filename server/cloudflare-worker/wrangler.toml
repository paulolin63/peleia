name = "peleia-gemini-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
GEMINI_MODEL = "gemini-3.6-flash"
ENVIRONMENT = "production"

# Durable Object para controle atômico e transacional de cotas (anti-race condition)
[durable_objects]
bindings = [
  { name = "QUOTA_DO", class_name = "QuotaDurableObject" }
]

[[migrations]]
tag = "v1"
new_classes = ["QuotaDurableObject"]

# Fallback KV namespace (opcional para leitura de cache)
[[kv_namespaces]]
binding = "QUOTA_KV"
id = "peleia_quota_kv"

# Os segredos devem ser configurados via CLI:
# wrangler secret put GEMINI_API_KEY
