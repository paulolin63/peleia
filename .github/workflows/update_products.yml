name: Auto Update & Publish Skincare Config

on:
  schedule:
    # Roda semanalmente aos domingos às 03:00 UTC (meia-noite de Brasília)
    - cron: '0 3 * * 0'
  # Permite disparar manualmente pelo botão "Run workflow" no GitHub
  workflow_dispatch:

jobs:
  publish-config:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cloudflare Worker Dependencies
        run: |
          cd server/cloudflare-worker
          npm install --legacy-peer-deps

      - name: Validate & Publish Config to Cloudflare KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ab48f7a2be15e4a97cc32e5d303f185a
          SHOPEE_AFFILIATE_TAG: ${{ secrets.SHOPEE_AFFILIATE_TAG }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
        run: |
          python3 scripts/publish_config.py

      - name: Commit & Push Updated Bundled Config
        run: |
          git config --global user.name "PeleIA Bot"
          git config --global user.email "bot@peleia.app"
          git add assets/config/peleia_config.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(config): auto-publish updated peleia_config [skip ci]"
            git push
          else
            echo "Nenhuma alteração na cópia embutida."
          fi
